# New_sage infrastructure — spec §13.
#
# Local-first Context7 alternative: single user, NO auth, CPU-only. The stack
# is HTTP-only on sage-net; the host firewall / Tailscale is the security
# boundary (spec §13). Do NOT publish these ports beyond the local network.
#
# DEVIATION from the §13 service list: Milvus standalone requires an external
# etcd container — embedded etcd was removed in Milvus 2.6.x ("panic: embedded
# etcd can not be used under distributed mode"), and this stack pins
# milvusdb/milvus:latest. The etcd service listens on the internal network
# only (no published ports) and is NOT part of the client port contract.
#
# Port contract (spec §13; sibling agents rely on these) — container ports,
# never remapped:
#   mcp-server 8000 | retrieval 8001 | embedding 8002 | ingestion-worker (no ports)
#   milvus-standalone 19530/9091 | rustfs 9000/9001 | postgres 5432 | redis 6379
#
# Host ports are overridable via ${*_HOST_PORT} env (defaults below). The
# defaults below live in the 8010/9010/19531 block so this stack does NOT
# collide with new_DRUID on the same host (druid: gateway 8080, vLLM 8000,
# document_api 8001, mcp 8002, embedding 8003, retrieval 8004, web_ui 8005,
# minio 9000/9001, milvus 19530/9091). Override in .env to change them.
# Inter-service URLs always use the fixed container ports + compose DNS names.
name: sage

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-sage}
    volumes:
    - /DATA/docker/mounts/sage/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sage} -d ${POSTGRES_DB:-sage}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

    networks:
    - default
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
    - /DATA/docker/mounts/sage/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # RustFS replaces MinIO (MinIO community edition was archived in 2026;
  # its Docker Hub repos were deleted). S3-compatible object store; the
  # image runs as non-root UID 10001 by default.
    networks:
    - default
  rustfs:
    image: rustfs/rustfs:1.0.1
    command: ["--console-address", ":9001"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-sage}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in deploy/.env}
    volumes:
    - /DATA/docker/mounts/sage/rustfs:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

    networks:
    - default
  etcd:
    # REQUIRED by milvus-standalone (see header note). Internal only.
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
    - /DATA/docker/mounts/sage/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

    networks:
    - default
  milvus-standalone:
    image: ${MILVUS_IMAGE:-milvusdb/milvus:v2.6.24}  # upgrade after validation
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      # Milvus shares OUR RustFS (separate bucket 'sage-milvus') instead of
      # running its own object store. The MINIO_* names below are REQUIRED
      # by Milvus itself — they point at RustFS's S3-compatible endpoint.
      MINIO_ADDRESS: rustfs:9000
      MINIO_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-sage}
      MINIO_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in deploy/.env}
      MINIO_USE_SSL: "false"
    volumes:
    - /DATA/docker/mounts/sage/milvus:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  # ── one-shot jobs ──────────────────────────────────────────────
    networks:
    - default
  catalog-migrate:
    # Runs the catalog's Alembic migrations, then exits (the catalog
    # README documents this as part of the stack). Retrieval and the
    # ingestion worker need the tables; they wait for this to succeed.
    build:
      context: ..
      dockerfile: services/catalog/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sage}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-sage}
    depends_on:
      postgres:
        condition: service_healthy
    # Run on first boot and after --recreate: docker compose run --rm catalog-migrate

    networks:
    - default
  milvus_setup:
    build:
      context: ..
      dockerfile: services/milvus_setup/Dockerfile
    environment:
      MILVUS_URI: http://milvus-standalone:19530
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-sage_chunks}
      MILVUS_WAIT_TIMEOUT_S: ${MILVUS_WAIT_TIMEOUT_S:-600}
    depends_on:
      milvus-standalone:
        condition: service_healthy
    # Retries the Milvus connection internally; exits when done.
    # Run on first boot and after --recreate: docker compose run --rm milvus_setup

  # ── long-running CPU services ──────────────────────────────────
    networks:
    - default
  embedding:
    build:
      context: ..
      dockerfile: services/embedding/Dockerfile
    environment:
      MODEL_PATH: ${MODEL_PATH:-/artifacts/embeddinggemma-2}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      # Staged model artifacts, READ-ONLY. Missing models fail startup
      # (offline-first, spec §14) — see deploy/README.md for staging.
    - /DATA/docker/mounts/sage/model-artifacts:/artifacts:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8002'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped

    networks:
    - default
  retrieval:
    build:
      context: ..
      dockerfile: services/retrieval/Dockerfile
    environment:
      MILVUS_URI: http://milvus-standalone:19530
      EMBEDDING_URL: http://embedding:8002
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sage}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-sage}
      MINILM_MODEL_PATH: ${MINILM_MODEL_PATH:-/artifacts/minilm}
      MINILM_TOKENIZER_PATH: ${MINILM_TOKENIZER_PATH:-/artifacts/minilm}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
    - /DATA/docker/mounts/sage/model-artifacts:/artifacts:ro
    depends_on:
      milvus-standalone:
        condition: service_healthy
      embedding:
        condition: service_healthy
      postgres:
        condition: service_healthy
      catalog-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8001'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

    networks:
    - default
  mcp-server:
    build:
      context: ..
      dockerfile: services/mcp_server/Dockerfile
    environment:
      # No auth — host firewall / Tailscale is the boundary (spec §13).
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
      RETRIEVAL_URL: http://retrieval:8001
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sage}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-sage}
      REDIS_URL: redis://redis:6379/0
      SAGE_AUTO_CRAWL: ${SAGE_AUTO_CRAWL:-0}
      SAGE_RESOLVER_REFRESH_SECONDS: ${SAGE_RESOLVER_REFRESH_SECONDS:-60}
    ports:
    - "${MCP_BIND_IP:-127.0.0.1}:${MCP_HOST_PORT:-8010}:8000"
    depends_on:
      retrieval:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

    networks:
    - default
  ingestion-worker:
    # RQ worker: no published ports. The ingestion agent owns this service's
    # Dockerfile and worker entrypoint; this is the compose wiring.
    build:
      context: ..
      dockerfile: services/ingestion/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sage}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-sage}
      MILVUS_URI: http://milvus-standalone:19530
      EMBEDDING_URL: http://embedding:8002
      MINILM_TOKENIZER_PATH: ${MINILM_TOKENIZER_PATH:-/artifacts/minilm}
      RUSTFS_ENDPOINT: rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-sage}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in deploy/.env}
    volumes:
    - /DATA/docker/mounts/sage/model-artifacts:/artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy
      catalog-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      embedding:
        condition: service_healthy
    restart: unless-stopped
    # Scale CPU workers: docker compose up -d --scale ingestion-worker=4

    networks:
    - default
  crawler-worker:
    # RQ worker: consumes the sage-crawl queue (spec §5.2, §9.3.1, §12).
    # Added in P5 hardening: the crawler Dockerfile and the sage-crawl queue
    # existed but nothing in the stack ran services.crawler.worker, so crawl
    # jobs (enqueue_crawl / refresh_stale) would pile up in Redis unprocessed.
    # No published ports. Scale if crawl load grows.
    build:
      context: ..
      dockerfile: services/crawler/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sage}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-sage}
      EMBEDDING_URL: http://embedding:8002
      MILVUS_URI: http://milvus-standalone:19530
      MINILM_TOKENIZER_PATH: ${MINILM_TOKENIZER_PATH:-/artifacts/minilm}
      RUSTFS_ENDPOINT: rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-sage}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in deploy/.env}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-sage-snapshots}
    volumes:
    - /DATA/docker/mounts/sage/model-artifacts:/artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy
      catalog-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      embedding:
        condition: service_healthy
      milvus-standalone:
        condition: service_healthy
    restart: unless-stopped

    networks:
    - default
  scheduler:
    # Weekly refresh_stale sweep (§12 stale-while-revalidate, §17.6).
    # Runs services.crawler.jobs.refresh_stale() in-process once per
    # REFRESH_INTERVAL_SECONDS (default 7 days), with startup jitter;
    # failures log and back off, never crash the loop. Enqueues crawl jobs
    # on the sage-crawl queue — crawler-worker consumes them.
    # Manual trigger: docker compose run --rm scheduler python -m scheduler.run --once
    build:
      context: ..
      dockerfile: services/scheduler/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sage}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-sage}
      REFRESH_INTERVAL_SECONDS: ${REFRESH_INTERVAL_SECONDS:-604800}
      SCHEDULER_STARTUP_JITTER_SECONDS: ${SCHEDULER_STARTUP_JITTER_SECONDS:-600}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    depends_on:
      postgres:
        condition: service_healthy
      catalog-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      crawler-worker:
        condition: service_started
    restart: unless-stopped

    networks:
    - default
  devdocs-scheduler:
    # Monthly DevDocs image sync (§5.1.1, §17.6): the same scheduler image,
    # but SCHEDULER_JOB=devdocs_sync and a 30-day interval. Once per
    # interval it enqueues ONE devdocs_sync RQ job on the sage-crawl queue
    # (services.crawler.jobs.enqueue_devdocs_sync); the crawler-worker runs
    # the pull + diff + ingest. This service never touches docker or the
    # image itself, so it needs only REDIS_URL — no DATABASE_URL.
    # Manual trigger: docker compose run --rm devdocs-scheduler python -m scheduler.run --once --job devdocs_sync
    build:
      context: ..
      dockerfile: services/scheduler/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      SCHEDULER_JOB: devdocs_sync
      REFRESH_INTERVAL_SECONDS: ${DEVDOCS_SYNC_INTERVAL_SECONDS:-2592000}
      SCHEDULER_STARTUP_JITTER_SECONDS: ${SCHEDULER_STARTUP_JITTER_SECONDS:-600}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    depends_on:
      redis:
        condition: service_healthy
      crawler-worker:
        condition: service_started
    restart: unless-stopped

    networks:
    - default

  sage-net:
    name: sage-net
