# New_sage infrastructure — spec §13.
#
# Local-first Context7 alternative: single user, NO auth, CPU-only. The stack
# is HTTP-only on sage-net; the host firewall / Tailscale is the security
# boundary (spec §13). Do NOT publish these ports beyond the local network.
#
# DEVIATION from the §13 service list: Milvus standalone requires an external
# etcd container — embedded etcd was removed in Milvus 2.6.x ("panic: embedded
# etcd can not be used under distributed mode"), and this stack pins
# milvusdb/milvus:latest. The etcd service listens on the internal network
# only (no published ports) and is NOT part of the client port contract.
#
# Port contract (spec §13; sibling agents rely on these):
#   mcp-server 8000 | retrieval 8001 | embedding 8002 | ingestion-worker (no ports)
#   milvus-standalone 19530/9091 | minio 9000/9001 | postgres 5432 | redis 6379
#
# Host ports are overridable via ${*_HOST_PORT} env (defaults below). If this
# stack runs on the same box as new_DRUID, which publishes the same host
# ports, set the overrides in .env so the two stacks do not collide.
# Inter-service URLs always use the fixed container ports + compose DNS names.
name: sage

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sage}
      POSTGRES_DB: ${POSTGRES_DB:-sage}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sage} -d ${POSTGRES_DB:-sage}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sage}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sage-minio}
    volumes:
      - miniodata:/data
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  etcd:
    # REQUIRED by milvus-standalone (see header note). Internal only.
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcddata:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  milvus-standalone:
    image: milvusdb/milvus:latest  # CPU-only, latest stable
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      # Milvus shares OUR MinIO (separate bucket 'sage-milvus') instead of
      # running its own object store.
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-sage}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-sage-minio}
      MINIO_USE_SSL: "false"
    volumes:
      - milvusdata:/var/lib/milvus
    ports:
      - "${MILVUS_HOST_PORT:-19530}:19530"
      - "${MILVUS_MGMT_HOST_PORT:-9091}:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  # ── one-shot jobs ──────────────────────────────────────────────
  catalog-migrate:
    # Runs the catalog's Alembic migrations, then exits (the catalog
    # README documents this as part of the stack). Retrieval and the
    # ingestion worker need the tables; they wait for this to succeed.
    build:
      context: ..
      dockerfile: services/catalog/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sage}:${POSTGRES_PASSWORD:-sage}@postgres:5432/${POSTGRES_DB:-sage}
    depends_on:
      postgres:
        condition: service_healthy
    # Run on first boot and after --recreate: docker compose run --rm catalog-migrate

  milvus_setup:
    build:
      context: ..
      dockerfile: services/milvus_setup/Dockerfile
    environment:
      MILVUS_URI: http://milvus-standalone:19530
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-sage_chunks}
      MILVUS_WAIT_TIMEOUT_S: ${MILVUS_WAIT_TIMEOUT_S:-600}
    depends_on:
      milvus-standalone:
        condition: service_healthy
    # Retries the Milvus connection internally; exits when done.
    # Run on first boot and after --recreate: docker compose run --rm milvus_setup

  # ── long-running CPU services ──────────────────────────────────
  embedding:
    build:
      context: ..
      dockerfile: services/embedding/Dockerfile
    environment:
      MODEL_PATH: ${MODEL_PATH:-/artifacts/embeddinggemma-2}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      # Staged model artifacts, READ-ONLY. Missing models fail startup
      # (offline-first, spec §14) — see deploy/README.md for staging.
      - model-artifacts:/artifacts:ro
    ports:
      - "${EMBEDDING_HOST_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8002'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  retrieval:
    build:
      context: ..
      dockerfile: services/retrieval/Dockerfile
    environment:
      MILVUS_URI: http://milvus-standalone:19530
      EMBEDDING_URL: http://embedding:8002
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sage}:${POSTGRES_PASSWORD:-sage}@postgres:5432/${POSTGRES_DB:-sage}
      MINILM_MODEL_PATH: ${MINILM_MODEL_PATH:-/artifacts/minilm}
      MINILM_TOKENIZER_PATH: ${MINILM_TOKENIZER_PATH:-/artifacts/minilm}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - model-artifacts:/artifacts:ro
    ports:
      - "${RETRIEVAL_HOST_PORT:-8001}:8001"
    depends_on:
      milvus-standalone:
        condition: service_healthy
      embedding:
        condition: service_healthy
      postgres:
        condition: service_healthy
      catalog-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8001'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  mcp-server:
    build:
      context: ..
      dockerfile: services/mcp_server/Dockerfile
    environment:
      # No auth — host firewall / Tailscale is the boundary (spec §13).
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
      RETRIEVAL_URL: http://retrieval:8001
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sage}:${POSTGRES_PASSWORD:-sage}@postgres:5432/${POSTGRES_DB:-sage}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${MCP_HOST_PORT:-8000}:8000"
    depends_on:
      retrieval:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  ingestion-worker:
    # RQ worker: no published ports. The ingestion agent owns this service's
    # Dockerfile and worker entrypoint; this is the compose wiring.
    build:
      context: ..
      dockerfile: services/ingestion/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sage}:${POSTGRES_PASSWORD:-sage}@postgres:5432/${POSTGRES_DB:-sage}
      MILVUS_URI: http://milvus-standalone:19530
      EMBEDDING_URL: http://embedding:8002
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sage}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sage-minio}
    volumes:
      - model-artifacts:/artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy
      catalog-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      embedding:
        condition: service_healthy
    restart: unless-stopped
    # Scale CPU workers: docker compose up -d --scale ingestion-worker=4

  crawler-worker:
    # RQ worker: consumes the sage-crawl queue (spec §5.2, §9.3.1, §12).
    # Added in P5 hardening: the crawler Dockerfile and the sage-crawl queue
    # existed but nothing in the stack ran services.crawler.worker, so crawl
    # jobs (enqueue_crawl / refresh_stale) would pile up in Redis unprocessed.
    # No published ports. Scale if crawl load grows.
    build:
      context: ..
      dockerfile: services/crawler/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sage}:${POSTGRES_PASSWORD:-sage}@postgres:5432/${POSTGRES_DB:-sage}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-sage}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-sage}
      MINIO_BUCKET: ${MINIO_BUCKET:-sage-snapshots}
    depends_on:
      postgres:
        condition: service_healthy
      catalog-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  etcddata:
  milvusdata:
  model-artifacts:

networks:
  sage-net:
    name: sage-net
