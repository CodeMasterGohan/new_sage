[project]
name = "new-sage-mcp-server"
version = "0.1.0"
description = "MCP server for New_sage: local-first Context7 alternative (no auth)"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.12.0",
    "pydantic==2.11.7",
    "httpx==0.28.1",
    "uvicorn==0.34.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
