name: Phase 1 contracts
on:
  push:
    branches: [main]
  pull_request:
jobs:
  code-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/mcp_server/requirements.txt
          pip install trafilatura==2.3.1 requests==2.34.2
          pip check
      - name: Syntax and unit/contract tests (fakes, no model weights)
        env:
          PYTHONPATH: .:services/mcp_server/src
        run: |
          python -m compileall -q services tests-e2e
          pytest -q services/mcp_server/tests \
            services/retrieval/tests/test_catalog_sql.py \
            services/retrieval/tests/test_retrieval.py \
            services/retrieval/tests/test_code_search.py \
            services/ingestion/tests/test_symbol_index.py \
            services/ingestion/tests/test_pipeline.py \
            services/crawler/tests/test_polite_fetch.py \
            services/crawler/tests/test_repo_provenance.py \
            services/eval/tests/test_live_retrieval.py \
            tests-e2e
      - name: Validate Docker Compose configuration
        run: |
          cp deploy/.env.example deploy/.env
          docker compose --env-file deploy/.env -f deploy/docker-compose.yml config --quiet
          docker compose --env-file deploy/.env -f deploy/docker-compose.embedding.yml config --quiet
  clean-image-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ingestion worker from tracked repository files
        run: docker build --file services/ingestion/Dockerfile --tag sage-ingestion:ci .
      - name: Build crawler worker from tracked repository files
        run: docker build --file services/crawler/Dockerfile --tag sage-crawler:ci .

  rust-markdown-fastpath:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Rust wheel builder and tests
        run: |
          python -m pip install "maturin>=1.7,<2" pytest==9.1.1 trafilatura==2.3.1
      - name: Build native PyO3 wheel from source
        run: |
          maturin build --release --interpreter python --manifest-path rust/markdown_fastpath/Cargo.toml --out /tmp/sage-wheels
          python -m pip install /tmp/sage-wheels/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: sage-markdown-fastpath-cp311-linux-wheel
          path: /tmp/sage-wheels/*.whl
          if-no-files-found: error
          retention-days: 14
      - name: Verify Rust and Python output parity and benchmark
        env:
          SAGE_RUST_FASTPATH: "1"
          PYTHONPATH: .
        run: |
          python -m pytest -q -s services/ingestion/tests/test_rust_markdown_fastpath.py

  gitlab-ci-manifest-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate GitLab YAML and deployment script structure
        run: |
          python -m pip install PyYAML==6.0.2
          python - <<'PY'
          from pathlib import Path
          import yaml
          pipeline = yaml.safe_load(Path(".gitlab-ci.yml").read_text())
          overlay = yaml.safe_load(Path(".gitlab/images.compose.yml").read_text())
          assert pipeline["workflow"]["rules"]
          assert "build-images" in pipeline
          assert "deploy-staging" in pipeline
          assert "deploy-production" in pipeline
          assert "migrate-staging" in pipeline
          assert "migrate-production" in pipeline
          assert "rollback-production" in pipeline
          assert pipeline["build-images"]["parallel"]["matrix"]
          assert overlay["services"]
          assert "secret-detection" in pipeline
          for key in ("DEPLOY_SSH_KEY_FILE", "DEPLOY_KNOWN_HOSTS_FILE"):
              assert key in Path(".gitlab/scripts/ssh-deploy.sh").read_text()
          PY
          sh -n .gitlab/scripts/ssh-deploy.sh
          sh -n .gitlab/scripts/remote-deploy.sh
      - name: Validate image overlay with current Compose files
        run: |
          cp deploy/.env.example deploy/.env
          CI_IMAGE_PREFIX=registry.example.invalid/org/project CI_IMAGE_TAG=abcdef123456 docker compose --env-file deploy/.env -f deploy/docker-compose.yml -f .gitlab/images.compose.yml config --quiet


  embedding-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight embedding adapter dependencies
        run: |
          python -m pip install -r services/embedding/requirements.txt pytest==8.3.5 PyYAML==6.0.2
          python -m pip check
      - name: Test shared vLLM forwarding without model downloads
        run: python -m pytest -q services/embedding/tests
      - name: Build the default embedding adapter
        run: docker build --file services/embedding/Dockerfile --tag sage-embedding:ci .
